name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt pytest

      - name: 语法检查
        run: python -m compileall -q core ingest server gateway ocr_service scripts

      - name: 单元测试
        run: python -m pytest tests/ -q

      # 评测需要 embedding 服务，未配置密钥时跳过。
      # 在仓库 Settings → Secrets 添加 EMBEDDING_* 后，可在本地或私有 runner 跑：
      #   python -m eval.run --dry-run
