<rect x="1036" y="464" width="340" height="116" fill="#F4F1EA" stroke="none" stroke-width="0" rx="4"/>
<text x="1050" y="488" font-size="12.5" fill="#1F1D1A" font-weight="600">N 535 NM · 氟橡胶 · Syensqo</text>
<text x="1050" y="510" font-size="10.5" fill="#45423C">压缩永久变形 14% · 200 °C · 70 h</text>
<text x="1050" y="530" font-size="10" fill="#6E6A62">来源：Tecnoflon 手册 p.5</text>
<text x="1050" y="556" font-size="10" fill="#6E6A62">其余证据按同样结构排列</text>
<rect x="1020" y="605" width="372" height="82" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="1036" y="633" font-size="15" fill="#1F1D1A" font-weight="600">答案生成</text>
<text x="1036" y="655" font-size="11.5" fill="#6E6A62">qwen2.5-72B，只依据检索证据</text>
<text x="1036" y="675" font-size="11.5" fill="#6E6A62">冲突分别列出；缺数据直说，不猜</text>
<rect x="1020" y="700" width="372" height="78" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="1036" y="728" font-size="15" fill="#1F1D1A" font-weight="600">回答与溯源</text>
<text x="1036" y="750" font-size="11.5" fill="#6E6A62">证据表格 + 引用 [n] + 来源卡片</text>
<text x="1036" y="770" font-size="11.5" fill="#6E6A62">文档 / 页码可点开核对</text>
