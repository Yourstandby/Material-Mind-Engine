<text x="482" y="398" font-size="10.5" fill="#6E6A62">压缩永久变形 14% · 200 °C · 70 h · 来源 p.5</text>
<rect x="452" y="450" width="532" height="112" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="468" y="478" font-size="15" fill="#1F1D1A" font-weight="600">语义检索 Retrieve</text>
<text x="468" y="500" font-size="11.5" fill="#6E6A62">· top-k：默认 5，清单类问题放到 12</text>
<text x="468" y="523" font-size="11.5" fill="#6E6A62">· 材质（FKM / FFKM / PEEK）与厂商双过滤</text>
<text x="468" y="546" font-size="11.5" fill="#6E6A62">· 温度类问题自动扩写检索词</text>
<rect x="452" y="582" width="532" height="112" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="468" y="610" font-size="15" fill="#1F1D1A" font-weight="600">上下文组装 Format</text>
<text x="468" y="632" font-size="11.5" fill="#6E6A62">· 中文字段标签；日语词转中文；温度补 °C</text>
<text x="468" y="655" font-size="11.5" fill="#6E6A62">· 每条证据独立成行，条件不跨记录拼接</text>
<text x="468" y="678" font-size="11.5" fill="#6E6A62">· 空字段省略，单条证据不套表格</text>
