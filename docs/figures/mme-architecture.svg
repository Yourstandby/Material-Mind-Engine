<text x="1036" y="389" font-size="11.5" fill="#6E6A62">点名厂商时只在该厂商内检索</text>
<rect x="1020" y="424" width="372" height="168" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
