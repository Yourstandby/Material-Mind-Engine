<text x="58" y="174" font-size="9.5" fill="#6E6A62" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" letter-spacing=".12em">LOCAL BOUNDARY · 127.0.0.1 · 单机 2×L20</text>
<text x="64" y="200" font-size="9.5" fill="#6E6A62" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" letter-spacing=".14em">01 / INGESTION</text>
<text x="64" y="220" font-size="16" fill="#A63D1E" font-weight="700">①</text>
<text x="88" y="220" font-size="15" fill="#1F1D1A" font-weight="600">资料入库</text>
<rect x="64" y="234" width="352" height="78" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="402" y="255" font-size="9.5" fill="#A63D1E" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" text-anchor="end" letter-spacing=".08em">01</text>
<text x="80" y="263" font-size="15" fill="#1F1D1A" font-weight="600">多格式资料</text>
<text x="80" y="286" font-size="11.5" fill="#6E6A62">PDF / DOCX / XLSX / HTML / MD / CSV</text>
<text x="80" y="303" font-size="11.5" fill="#6E6A62">Web 上传、inbox 目录或 CLI 投放</text>
<rect x="64" y="325" width="352" height="78" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="402" y="346" font-size="9.5" fill="#A63D1E" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" text-anchor="end" letter-spacing=".08em">02</text>
<text x="80" y="354" font-size="15" fill="#1F1D1A" font-weight="600">解析与 OCR</text>
<text x="80" y="377" font-size="11.5" fill="#6E6A62">文本层优先；扫描件与缺字页交给 OCR</text>
<text x="80" y="394" font-size="11.5" fill="#6E6A62">PP-OCRv5 · 中 / 英 / 日</text>
<rect x="64" y="416" width="352" height="78" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="402" y="437" font-size="9.5" fill="#A63D1E" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" text-anchor="end" letter-spacing=".08em">03</text>
<text x="80" y="445" font-size="15" fill="#1F1D1A" font-weight="600">语义分块</text>
<text x="80" y="468" font-size="11.5" fill="#6E6A62">800 字滑窗，表头随块继承</text>
<text x="80" y="485" font-size="11.5" fill="#6E6A62">跨块表格仍能对齐列名</text>
<rect x="64" y="507" width="352" height="78" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="402" y="528" font-size="9.5" fill="#A63D1E" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" text-anchor="end" letter-spacing=".08em">04</text>
<text x="80" y="536" font-size="15" fill="#1F1D1A" font-weight="600">结构化抽取</text>
<text x="80" y="559" font-size="11.5" fill="#6E6A62">LLM 抽取 11 个字段</text>
<text x="80" y="576" font-size="11.5" fill="#6E6A62">同表多次测试拆成多条记录</text>
<rect x="64" y="598" width="352" height="78" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="402" y="619" font-size="9.5" fill="#A63D1E" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" text-anchor="end" letter-spacing=".08em">05</text>
<text x="80" y="627" font-size="15" fill="#1F1D1A" font-weight="600">归一与去重</text>
<text x="80" y="650" font-size="11.5" fill="#6E6A62">牌号 / 供应商 / 单位统一</text>
<text x="80" y="667" font-size="11.5" fill="#6E6A62">内容哈希去重，幂等写入</text>
<rect x="64" y="689" width="352" height="78" fill="#FBFAF7" stroke="#C8C3B8" stroke-width="1.1" rx="3"/>
<text x="402" y="710" font-size="9.5" fill="#A63D1E" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" text-anchor="end" letter-spacing=".08em">06</text>
<text x="80" y="718" font-size="15" fill="#1F1D1A" font-weight="600">向量化入库</text>
<text x="80" y="741" font-size="11.5" fill="#6E6A62">bge-m3 → 1024 维向量</text>
<text x="80" y="758" font-size="11.5" fill="#6E6A62">写入 Chroma 的 catalog 集合</text>
