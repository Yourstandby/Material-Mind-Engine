<rect width="1440" height="1000" fill="#FFFFFF"/>
<text x="64" y="60" font-size="10" fill="#6E6A62" font-family="Consolas,'SF Mono','JetBrains Mono',monospace" letter-spacing=".16em">FIGURE 1 · SYSTEM ARCHITECTURE</text>
<text x="64" y="102" font-size="27" fill="#1F1D1A" font-weight="700">Material Mind Engine：从资料到可溯源回答</text>
<text x="64" y="130" font-size="13" fill="#6E6A62">双流水线：离线入库 × 在线检索生成 · 全本地部署（2×L20）· 中 / 英 / 日资料统一处理</text>
