<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未命中看板 · Material Mind Engine</title>
<link rel="stylesheet" href="/assets/style.css?v=20261124e">
</head>
<body class="adm-body">
<div class="adm">
  <header class="adm-top">
    <div class="adm-headtext">
      <span class="adm-kicker">Material Mind Engine</span>
      <h1>未命中看板</h1>
      <p class="adm-sub">库里没有资料的提问 + 用户主动催的资料。补完资料后点「已补」，该问题即从看板移除。</p>
    </div>
    <a class="btn-ghost adm-back" href="/">← 返回对话</a>
  </header>

  <div class="stats" id="adbStats"></div>

  <section class="adm-card">
    <div class="adm-card-head">
      <h2>资料可见级别</h2>
      <span class="adm-hint">级别 = 最低可见角色，单向包含：游客可见 ⊃ 登录用户可见 ⊃ 仅管理员</span>
    </div>
    <div class="folder-bar">
      <label class="adm-field"><span>新投喂默认</span><select id="adbDefault"></select></label>
      <label class="adm-field"><span>按文件夹批量</span><select id="adbFolder"><option value="">选文件夹…</option></select></label>
      <label class="adm-field"><span>设为</span><select id="adbLevelPick"></select></label>
      <button type="button" id="adbFolderGo" class="btn">应用到整个文件夹</button>
    </div>
    <div id="adbDocs"><div class="empty">加载中…</div></div>
  </section>

  <section class="adm-card">
    <div class="adm-card-head">
      <h2>该补哪些资料</h2>
      <span class="adm-hint">按未命中问题里出现的关键词聚合，出现越多越该补</span>
    </div>
    <div class="chips" id="adbWanted"><span class="empty">加载中…</span></div>
  </section>

  <section class="adm-card">
    <div class="adm-card-head">
      <h2>未命中问题</h2>
      <span class="adm-hint">「用户催」为用户主动上报，「自动记录」为检索无结果</span>
    </div>
    <div id="adbList"><div class="empty">加载中…</div></div>
  </section>
</div>
<div class="toast" id="adbToast"></div>
<script src="/assets/admin.js?v=20261124c"></script>
</body>
</html>
