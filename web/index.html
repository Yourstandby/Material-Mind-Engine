<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Mind Engine</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="brand" href="#" aria-label="Material Mind Engine">
      <span class="brand-mark"></span>
      <span class="brand-text"><strong>Material Mind</strong><em>Engine</em></span>
    </a>

    <nav class="viewnav" id="viewNav">
      <button class="viewlink active" id="viewChat" type="button"><span class="ico" data-icon="chat"></span>对话</button>
      <button class="viewlink" id="viewResources" type="button"><span class="ico" data-icon="database"></span>资料库<span class="nav-count" id="resCount"></span></button>
    </nav>

    <div class="topbar-right">
      <span class="status"><i class="dot"></i><span id="statusText">本地知识库</span></span>
      <button class="up-btn" id="upBtn" type="button"><span class="ico" data-icon="upload"></span>投喂</button>
      <button class="kbd-btn" id="paletteBtn" type="button"><span class="ico" data-icon="search"></span><kbd>Ctrl K</kbd></button>
      <button class="kbd-btn" id="acctBtn" type="button">账号</button>
      <button class="kbd-btn" id="logoutBtn" type="button">退出</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换外观"><span id="themeIco"></span></button>
    </div>
  </header>

  <main class="main">
    <div class="view" id="chatView">
      <div class="collbar">
        <div class="collnav"><select id="productSelect" class="product-select" aria-label="选择产品"></select></div>
        <span class="coll-count" id="crumbCount"></span>
        <span class="coll-label" id="crumbLabel"></span>
      </div>

      <div class="scroll" id="scroll">
        <div class="stack" id="stack">
          <section class="hero" id="hero">
            <p class="eyebrow">Local Knowledge Retrieval</p>
            <h1>材料数据<br>一问直达</h1>
            <p class="lede">检索本地知识库，答案附编号引用与原始来源。数据不出内网，冲突值显式标注。</p>
            <div class="examples" id="examples"></div>
          </section>
        </div>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="form" autocomplete="off">
          <textarea id="input" rows="1" placeholder="提问…"></textarea>
          <button class="send" id="send" type="submit" aria-label="发送">↑</button>
        </form>
        <div class="hint"><span>Enter 发送 · Shift + Enter 换行</span><span id="hits"></span></div>
      </div>
    </div>

    <div class="view hidden" id="resourcesView">
      <div class="res-bar">
        <select id="resSeg" class="product-select res-select" aria-label="按产品筛选"></select>
        <input id="resFilter" class="res-filter" placeholder="筛选文件名或牌号…" autocomplete="off">
        <div class="res-search">
          <input id="searchTest" placeholder="检索测试：看命中了哪几条">
          <button id="searchBtn" type="button">检索</button>
        </div>
      </div>
      <div class="res-body">
        <div class="res-meta" id="resMeta">加载中…</div>
        <div class="res-hits" id="searchHits" hidden></div>
        <div id="resList"></div>
      </div>
    </div>
  </main>
</div>

<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <div class="drawer-title-wrap">
      <div class="drawer-title" id="drawerTitle"></div>
      <div class="drawer-sub" id="drawerSub"></div>
    </div>
    <button class="drawer-close" id="drawerClose" type="button" aria-label="关闭"><span class="ico" data-icon="x"></span></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <a class="btn-ghost" id="drawerOpen" target="_blank" rel="noopener" hidden>打开原文</a>
    <button class="btn-ghost reparse" id="drawerReparse" type="button"><span class="ico" data-icon="refresh"></span>重新解析</button>
    <button class="btn-ghost" id="drawerCancel" type="button">关闭</button>
    <button class="btn-danger" id="drawerDelete" type="button">删除这份资料</button>
  </div>
</aside>

<div class="bulk" id="bulk" hidden>
  <span class="bulk-count" id="bulkCount">已选 0 项</span>
  <button id="bulkExport" type="button"><span class="ico" data-icon="download"></span>导出</button>
  <button id="bulkDelete" type="button" class="danger"><span class="ico" data-icon="trash"></span>删除</button>
</div>

<div class="uploader" id="uploader" hidden>
  <div class="uploader-head">
    <span class="uploader-title">入库队列</span>
    <span class="uploader-sum" id="upSum"></span>
    <button class="uploader-close" id="upClose" type="button" aria-label="收起"><span class="ico" data-icon="x"></span></button>
  </div>
  <div class="uploader-list" id="upList"></div>
</div>

<div class="toasts" id="toasts"></div>

<div class="modal" id="acctModal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <span>账号设置</span>
      <button class="modal-x" id="acctClose" type="button" aria-label="关闭">✕</button>
    </div>
    <p class="modal-sub" id="acctWho"></p>
    <label class="mfield"><span>当前密码</span><input id="pwOld" type="password" autocomplete="current-password"></label>
    <label class="mfield"><span>新密码（至少 8 位）</span><input id="pwNew" type="password" autocomplete="new-password"></label>
    <label class="mfield"><span>再次输入新密码</span><input id="pwNew2" type="password" autocomplete="new-password"></label>
    <div class="acct-admin" id="acctAdmin" hidden>
      <div class="acct-admin-head">成员密码重置</div>
      <select id="acctUserSel"></select>
      <input id="acctNewPw" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password">
      <button class="btn-primary" id="acctReset" type="button">重置</button>
      <div class="acct-note" id="acctNote">重置后该成员所有设备需重新登录</div>
    </div>
    <div class="modal-foot"><span id="acctMsg"></span><button class="btn-primary" id="pwSave" type="button">保存</button></div>
  </div>
</div>

<div class="palette" id="palette" hidden>
  <div class="palette-box">
    <input id="paletteInput" placeholder="搜索知识库或问题…" autocomplete="off">
    <div class="palette-list" id="paletteList"></div>
    <div class="palette-foot"><kbd>↑↓</kbd> 选择 <kbd>Enter</kbd> 确认 <kbd>Esc</kbd> 关闭</div>
  </div>
</div>

<div class="drop" id="drop"><div class="drop-inner">松手即入库</div></div>
<div id="chips" hidden></div>
<input type="file" id="fileInput" multiple hidden
  accept=".pdf,.docx,.xlsx,.xlsm,.html,.htm,.md,.txt,.csv,.json">

<script src="/assets/icons.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/resources.js"></script>
<script src="/assets/upload.js"></script>
</body>
</html>
